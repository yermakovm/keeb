# Left half: split central. Zephyr merges this automatically when
# SHIELD=keeb_left.
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# Matrix rows are direct nRF52840 GPIO inputs (see keeb.dtsi), so the kscan
# driver runs in interrupt mode - no polling, and the nRF PIN SENSE/DETECT
# hardware stays armed so a key press can wake the SoC from deep sleep.
# Deep sleep (System OFF) after CONFIG_ZMK_IDLE_SLEEP_TIMEOUT of idle; any
# key on a half wakes that half. NB: both halves sleep independently -
# press a key on EACH half to wake the pair, and expect a few seconds of
# BLE reconnection before input flows.
CONFIG_ZMK_SLEEP=y

# Make &bootloader (reboot into the UF2 bootloader from the keymap) work:
# routes the Adafruit nRF52 boot-mode magic (0x57) into GPREGRET via the
# retention nodes the xiao_ble_zmk board file already sets up.
CONFIG_ZMK_BOOTMODE_MAGIC_VALUE_BOOTLOADER_TYPE_ADAFRUIT_NRF52=y

# Custom status screen (boards/shields/keeb/ui): LVGL composes the panels on a
# canvas, which needs more UI-thread stack and more LVGL heap than ZMK's
# defaults are sized for, and the layer readout must not blank on idle.
# Set here rather than in the module Kconfig: Kconfig takes the *first*
# matching default, and ZMK's/LVGL's own defaults are parsed earlier.
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096
CONFIG_LV_Z_MEM_POOL_SIZE=8192
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y
# Panels are mounted vertically: the UI is laid out in a 68x160 portrait space
# and rotated into the 160x68 framebuffer (see keeb_ui.c), which also selects
# the portrait artwork set (boards/shields/keeb/ui/art).
CONFIG_KBEEB_UI_ROTATION_90=y
# I2C bus for the MCP23017 (i2c1); the driver would otherwise be silently
# dropped (GPIO_MCP230XX depends on I2C, and I2C has no default-on here).
CONFIG_I2C=y
CONFIG_GPIO_MCP230XX=y
CONFIG_ZMK_LOG_LEVEL_DBG=y
#CONFIG_I2C_LOG_LEVEL_DBG=y
#CONFIG_GPIO_LOG_LEVEL_DBG=y

CONFIG_CLOCK_CONTROL_NRF_K32SRC_SYNTH=y

# Host link (central -> Mac): the connection-parameter set this half
# *recommends* to the host while pairing/connecting (Zephyr
# BT_PERIPHERAL_PREF_*, zmk/app/src/ble.c). Zephyr's default latency of 30
# lets the peripheral defer notifications for interval * latency, i.e. up to
# ~450 ms at a 15 ms interval when the host is not polling - the "occasional
# laggy keystroke" signature. Recommend 1 (min/max interval 6/12 = 7.5-15 ms
# stay at Zephyr's defaults; 1.2 * (1 + 1) * 15ms = 36ms << the 400ms
# timeout). macOS chooses the final parameters and may ignore the
# recommendation - CONFIG_ZMK_LOG_LEVEL_DBG=y above makes ble.c:568
# le_param_updated log what the host actually granted, so verify there rather
# than assuming.
CONFIG_BT_PERIPHERAL_PREF_LATENCY=1

# Right half's battery, relayed to this central over the split BLE link:
# subscribe to the peripheral's BAS battery-level characteristic and
# re-raise its readings as zmk_peripheral_battery_state_changed - the
# event the status screen's RIGHT readout caches (panel_central.c) - plus
# proxy them to the host as an auxiliary BAS attribute. No Kconfig
# defaults; without the fetching one the right half's level never reaches
# the central and the readout stays "--".
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Disable the external QSPI NOR flash: the xiao_ble devicetree declares a
# Puya P25Q32SH (jedec 85 60 15) but this board is a later revision with a
# Winbond W25Q32 (ef 40 15), so the driver aborts on a JEDEC mismatch.
# ZMK keeps settings/bonds in internal flash, so the NOR is unused anyway.
CONFIG_NORDIC_QSPI_NOR=n
CONFIG_FLASH=y
CONFIG_SOC_FLASH_NRF=y
#CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=y

CONFIG_LOG_BUFFER_SIZE=16384        
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
CONFIG_ZMK_POINTING=y

# Live keymap mutation engine: the TLV config channel over a vendor BLE GATT
# service (proto/, engine/, keymap/, transport/ in keeb-module). ZMK Studio is
# not involved and not compiled.
#
# Central-only, because ZMK resolves bindings on the central and the peripheral
# executes the binding it is sent (zmk/app/src/split/peripheral.c), and only the
# central holds the host connection a config channel needs.
#
# Enabling it selects ZMK's own dynamic-keymap core instead of a second keymap
# implementation: CONFIG_ZMK_KEYMAP_SETTINGS_STORAGE (mutable layout plus its
# NVS persistence), CONFIG_ZMK_KEYMAP_LAYER_REORDERING (layer add/remove/
# reorder) and CONFIG_ZMK_BEHAVIOR_METADATA (so a binding is validated by ZMK's
# own zmk_behavior_validate_binding, and the configurator can ask the firmware
# what a token's parameters mean). These are the same core options ZMK Studio
# selects - the feature, without Studio's RPC.
CONFIG_KBEEB_ENGINE=y
