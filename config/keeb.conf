# Shared Kconfig for both halves of the split keyboard.

# Shows up as the USB product name and BLE advertising name — also makes
# the halves identifiable as /dev/cu.keeb* on macOS.
CONFIG_ZMK_KEYBOARD_NAME="keeb"

# BLE split link (central/peripheral roles)
CONFIG_ZMK_SPLIT=y

# nice!view status screen on the LS011B7DH03 panel
CONFIG_ZMK_DISPLAY=y

CONFIG_ZMK_USB_LOGGING=y

# Status LED: KY-016 RGB module on D19/D20/D21 (P0.02 / P0.29 / P0.31) - see
# keeb-module/readme.md. Boot blinks, connect flash, advertising blink, solid
# on battery error.
CONFIG_ZMK_STATUS_LED=y

# Every lit signal at half brightness. The three channels are `pwm-leds` on
# &pwm1 (see keeb.dtsi), so this is a hardware duty cycle, not a trick: no
# flicker at the 2 ms period, and an OFF or solid-100% channel stops the PWM
# peripheral entirely. Set 100 for the old full-on behaviour. Lowering this is
# also the cheapest way to cut the LED's share of the battery, since the layer
# color and the battery-error red are solid states.
CONFIG_ZMK_STATUS_LED_BRIGHTNESS_PERCENT=50

# Buzzer: KY-006 passive piezo on the LEFT half's P1.01, driven by buzzer/ as a
# PWM tone (&pwm0 channel 0). What it sounds for is set on the devicetree, not
# here: GAME layer in/out (beep-layers), left_reset_combo (random tune then
# reboot), left_boot_combo (bootloader tune), the TLV engine's accepted/refused
# updates, and a wake from sleep (beep-on-wake). See buzzer/README.md.
#
# The option is shared because the behavior nodes and the keymap are shared - the
# DEVICE node and the &pwm0 enable live only in keeb_left.overlay, and on the
# right half the driver compiles to a "no buzzer here" stub so the same keymap
# still builds.
CONFIG_ZMK_BUZZER=y

# Battery monitoring.
# &vbatt is declared in keeb-module/boards/shields/keeb/keeb.dtsi, not by the
# board file, as zmk,battery-nrf-vddh: these clone boards have no divider on
# P0.04/AIN2, so the level is read from the VDDH rail. A v1-style nice!nano
# instead carries a 2M / 806k divider on AIN2 and would use
# zmk,battery-voltage-divider (and BOARD=nice_nano@1.0.0//zmk). Keeping the
# choice in the shield file keeps it next to the wiring it belongs to.
# ZMK_BLE only *implies* reporting, and the keeb status screen reads
# zmk_battery_level() directly, so state it explicitly here - the feature
# survives config shuffling and is visible in this file.
# NB: this also drives the peripheral->central battery relay that the left
# panel's "RIGHT" readout depends on; keep it enabled on both halves.
CONFIG_ZMK_BATTERY_REPORTING=y
# Report interval: 60 s default is fine for the screen (it refreshes on
# each report); BLE Battery Service also carries the peripheral's level
# to the host via the central.
# CONFIG_ZMK_BATTERY_REPORT_INTERVAL is left at 60

# Status screen: keeb-module provides the panels (KBEEB_UI defaults to y when
# a keeb shield is selected). Rotation lives in the module's Kconfig - see
# firmware/README. ZMK's built-in widgets are not built, so no
# CONFIG_ZMK_WIDGET_* here.


# --- BLE connection timing ---------------------------------------------------
# Split link (right half -> central). The central creates that connection with
# these parameters (zmk/app/src/split/bluetooth/central.c:817), so they belong
# in the shared config; only the central consumes them.
# ZMK's defaults INT=6 / LATENCY=30 / TIMEOUT=400 violate the BLE spec rule
#   timeout > (1 + latency) * interval * 2   ->  (1 + 30) * 7.5ms * 2 = 465ms > 400ms,
# i.e. the configured supervision timeout is smaller than the allowed minimum:
# the central can drop the peripheral after 400 ms of radio inactivity while
# the peripheral is still within its legal 30-event skip. That shows up as
# spurious right-half disconnects (HCI reason 0x08) followed by a several
# second reconnect gap. Latency 2 keeps worst-case deferral at ~22 ms and
# 600 ms is comfortably above the required 1.2 * (1 + 2) * 7.5ms = 45 ms.
# CONFIG_ZMK_SPLIT_BLE_PREF_INT stays at ZMK's default 6 (7.5 ms).
CONFIG_ZMK_SPLIT_BLE_PREF_LATENCY=2
CONFIG_ZMK_SPLIT_BLE_PREF_TIMEOUT=600

# Deep sleep (System OFF) after 5 min of idle instead of ZMK's 15 min default:
# the halves reach System OFF sooner, so the battery drains slower while idle,
# at the cost of hitting the wake + reconnect gap more often after a typing
# pause. Raise this (or set it per half) if that gap matters more than idle
# drain.
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=300000

# --- TEMP: BLE pairing diagnostics -----------------------------------------
# SMP + security failure trace for the Mac-pairing investigation. The
# security_changed callback prints the plain numeric err; ERR_TO_STR turns
# it into the enum name, and the SMP debug log shows the actual pairing
# exchange (Pairing Request/Response, key distribution, failure reason).
# Remove once the Mac pairing issue is resolved.
CONFIG_BT_SECURITY_ERR_TO_STR=y
CONFIG_BT_SMP_LOG_LEVEL_DBG=y
