     Replace the <img src> in docs/7_2_components.md with assets/components.png. -->
<rect width="640" height="400" fill="#0b0e11"/>
<rect x="14" y="14" width="612" height="372" rx="14" fill="none" stroke="#2b343c" stroke-width="3" stroke-dasharray="16 11"/>

<!-- Pro Micro board -->
<g stroke="#4c5a66" stroke-width="2.5" fill="none">
  <rect x="60" y="70" width="220" height="96" rx="6"/>
  <rect x="88" y="84" width="30" height="14" rx="2"/>
  <rect x="88" y="138" width="30" height="14" rx="2"/>
  <rect x="222" y="84" width="30" height="14" rx="2"/>
  <rect x="222" y="138" width="30" height="14" rx="2"/>
  <rect x="150" y="100" width="56" height="36" rx="3"/>
</g>
<g fill="#97a3af" font-size="12">
  <text x="170" y="122" text-anchor="middle">nRF52840</text>
  <text x="170" y="190" text-anchor="middle">Pro Micro плата</text>
</g>

<!-- nice!view screen -->
<g stroke="#4c5a66" stroke-width="2.5" fill="none">
  <rect x="330" y="70" width="150" height="96" rx="6"/>
  <rect x="348" y="86" width="114" height="64" rx="3"/>
