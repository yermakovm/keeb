<!-- KY modules -->
<g stroke="#4c5a66" stroke-width="2.5" fill="none">
  <rect x="510" y="70" width="90" height="60" rx="6"/>
  <circle cx="534" cy="100" r="9"/><circle cx="556" cy="100" r="9"/><circle cx="578" cy="100" r="9"/>
  <rect x="510" y="146" width="90" height="44" rx="6"/>
  <circle cx="555" cy="168" r="14"/>
</g>
<g fill="#97a3af" font-size="12"><text x="555" y="210" text-anchor="middle">KY-016 · базер</text></g>

<!-- switch + hotswap row -->
