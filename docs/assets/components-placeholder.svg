<!-- 3d printed case outline -->
<g stroke="#4c5a66" stroke-width="2" fill="none">
  <path d="M330 236 h270 q20 0 20 20 v40 q0 20 -20 20 h-270 q-20 0 -20 -20 v-40 q0 -20 20 -20 z"/>
