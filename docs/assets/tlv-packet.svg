<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="system-ui, -apple-system, 'SF Pro Text', 'Segoe UI', 'PT Sans', 'Noto Sans', Arial, sans-serif">
  <!--
    KEEB TLV framing — the I2C/SPI-style field picture.

    Every number here is read out of the firmware, not invented:
      keeb-module/proto/keeb_tlv_wire.h   KEEB_TLV_MAGIC 0x4b45 · KEEB_TLV_VERSION 1
                                          KEEB_PKT_HDR_SIZE 16 · KEEB_TLV_MSG_MAX 1024
                                          KEEB_TLV_FRAG_MAX 128 · KEEB_TLV_FRAG_MIN 20
                                          KEEB_PKT_F_REPLY 0x01 / F_NOTIFY 0x02 / F_FIRST 0x04
      keeb-module/transport/keeb_ble.c    CONFIG_BT_L2CAP_TX_MTU 65 · ATT overhead 3
                                          KEEB_BLE_MAX_FRAG = 65 - 3 - 16 = 46

    The 484 B example is one layer of CELLS: keeb_cells_hdr (4 B) + 30 cells × 16 B.
  -->

  <defs>
    <marker id="tick" viewBox="0 0 6 6" refX="3" refY="6" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M3 0 V6" stroke="#4c5a66" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- ① the ATT PDU envelope -->
  <text x="40" y="40" fill="#6ee7a0" font-size="12" letter-spacing="1">① ATT PDU — СТЕЛЯ НА ОДИН ПАКЕТ</text>
  <text x="760" y="40" fill="#4c5a66" font-size="12" text-anchor="end">CONFIG_BT_L2CAP_TX_MTU = 65 B</text>

  <g stroke-width="1.5">
    <rect x="40" y="50" width="33" height="42" fill="#10151a" stroke="#394853"/>
    <rect x="73" y="50" width="176" height="42" fill="#12251c" stroke="#6ee7a0" stroke-opacity="0.55"/>
    <rect x="249" y="50" width="506" height="42" fill="#141a20" stroke="#2b343c"/>
  </g>
  <g font-size="11" fill="#97a3af">
    <text x="56" y="68" text-anchor="middle">3 B</text>
    <text x="56" y="82" text-anchor="middle">ATT</text>
    <text x="161" y="68" text-anchor="middle" fill="#e8ecf0">ЗАГОЛОВОК KEEB — 16 B</text>
    <text x="161" y="82" text-anchor="middle">65 − 3 − 16 = 46 B payload</text>
    <text x="502" y="68" text-anchor="middle" fill="#e8ecf0">frag_len — payload фрагмента, максимум 46 B</text>
    <text x="502" y="82" text-anchor="middle">staging-буфер дозволяє 128 B, BLE бере лише 46 B; не падає нижче 20 B</text>
  </g>

  <!-- ② the 16-byte header, expanded -->
  <text x="40" y="128" fill="#6ee7a0" font-size="12" letter-spacing="1">② ЗАГОЛОВОК ПАКЕТА — 16 B, PACKED LITTLE-ENDIAN</text>

  <g stroke="#2b343c" stroke-width="1.5" fill="#141a20">
    <rect x="40" y="138" width="80" height="52"/>
    <rect x="120" y="138" width="40" height="52"/>
    <rect x="160" y="138" width="40" height="52"/>
    <rect x="200" y="138" width="80" height="52"/>
    <rect x="280" y="138" width="80" height="52"/>
    <rect x="360" y="138" width="80" height="52"/>
    <rect x="440" y="138" width="80" height="52"/>
    <rect x="520" y="138" width="160" height="52"/>
  </g>
  <g font-size="11" fill="#e8ecf0" text-anchor="middle">
    <text x="80" y="158">magic</text>
    <text x="140" y="158" font-size="10">version</text>
    <text x="180" y="158" font-size="10">flags</text>
    <text x="240" y="158">msg_id</text>
    <text x="320" y="158">frag_off</text>
    <text x="400" y="158">frag_len</text>
    <text x="480" y="158">msg_len</text>
    <text x="600" y="158">crc32</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#6ee7a0" text-anchor="middle">
    <text x="80" y="176">0x4b45</text>
    <text x="140" y="176">1</text>
    <text x="180" y="176">0x04</text>
    <text x="240" y="176">0x0007</text>
    <text x="320" y="176">0 · 46 · 460</text>
    <text x="400" y="176">46</text>
    <text x="480" y="176">488</text>
    <text x="600" y="176">CRC-32/IEEE</text>
  </g>
  <g font-size="10" fill="#4c5a66" text-anchor="middle">
    <text x="80" y="200">2 B</text>
    <text x="140" y="200">1 B</text>
    <text x="180" y="200">1 B</text>
    <text x="240" y="200">2 B</text>
    <text x="320" y="200">2 B</text>
    <text x="400" y="200">2 B</text>
    <text x="480" y="200">2 B</text>
    <text x="600" y="200">4 B</text>
  </g>

  <!-- byte ruler -->
  <line x1="40" y1="214" x2="680" y2="214" stroke="#4c5a66" stroke-width="1.2"/>
  <g font-size="10" fill="#4c5a66" text-anchor="middle">
    <text x="40" y="228">0</text>
    <text x="120" y="228">2</text>
    <text x="160" y="228">3</text>
    <text x="200" y="228">4</text>
    <text x="280" y="228">6</text>
    <text x="360" y="228">8</text>
    <text x="440" y="228">10</text>
    <text x="520" y="228">12</text>
    <text x="680" y="228">16</text>
  </g>
  <!-- ③ flags bits -->
  <text x="40" y="248" fill="#6ee7a0" font-size="12" letter-spacing="1">③ FLAGS — 1 БАЙТ, ТРИ ПРАПОРЦІ</text>
  <g stroke="#2b343c" stroke-width="1.5" fill="#10151a">
    <rect x="40" y="272" width="30" height="30"/>
    <rect x="70" y="272" width="30" height="30"/>
    <rect x="100" y="272" width="30" height="30"/>
    <rect x="130" y="272" width="30" height="30"/>
    <rect x="160" y="272" width="30" height="30"/>
    <rect x="190" y="272" width="30" height="30" fill="#12251c" stroke="#6ee7a0" stroke-opacity="0.55"/>
    <rect x="220" y="272" width="30" height="30" fill="#12251c" stroke="#6ee7a0" stroke-opacity="0.55"/>
    <rect x="250" y="272" width="30" height="30" fill="#12251c" stroke="#6ee7a0" stroke-opacity="0.55"/>
  </g>
  <g font-size="10" fill="#4c5a66" text-anchor="middle">
    <text x="55" y="266">7</text><text x="85" y="266">6</text><text x="115" y="266">5</text><text x="145" y="266">4</text>
    <text x="175" y="266">3</text><text x="205" y="266">2</text><text x="235" y="266">1</text><text x="265" y="266">0</text>
  </g>
  <g font-size="10.5" fill="#6ee7a0" text-anchor="middle">
    <text x="205" y="316">FIRST</text>
    <text x="235" y="332">NOTIFY</text>
    <text x="265" y="348">REPLY</text>
  </g>
  <g font-size="11.5" fill="#97a3af">
    <text x="310" y="284">FIRST — перший фрагмент: скидає reassembly</text>
    <text x="310" y="302">і виправляє прогалину (командний канал пише</text>
    <text x="310" y="320">без відповіді, фрагмент справді може загубитись)</text>
    <text x="310" y="344">REPLY | NOTIFY — повідомлення від клавіатури</text>
    <text x="310" y="362">bits 3–7 — zero</text>
  </g>

  <!-- ④ one message, 11 fragments -->
  <text x="40" y="402" fill="#6ee7a0" font-size="12" letter-spacing="1">④ ПОВІДОМЛЕННЯ = 11 ФРАГМЕНТІВ ПО 46 B</text>
  <text x="760" y="402" fill="#4c5a66" font-size="12" text-anchor="end">4 + 4 + 30×16 = 488 B → ceil(488 / 46) = 11</text>

  <g stroke="#2b343c" stroke-width="1.5" fill="#141a20">
    <rect x="40" y="412" width="60.8" height="34"/>
    <rect x="100.8" y="412" width="60.8" height="34"/>
    <rect x="161.6" y="412" width="60.8" height="34"/>
    <rect x="222.4" y="412" width="60.8" height="34"/>
    <rect x="283.2" y="412" width="60.8" height="34"/>
    <rect x="344" y="412" width="60.8" height="34"/>
    <rect x="404.8" y="412" width="60.8" height="34"/>
    <rect x="465.6" y="412" width="60.8" height="34"/>
    <rect x="526.4" y="412" width="60.8" height="34"/>
    <rect x="587.2" y="412" width="60.8" height="34"/>
    <rect x="645.4" y="412" width="28.2" height="34" fill="#12251c" stroke="#6ee7a0" stroke-opacity="0.55"/>
  </g>
  <g font-size="10" fill="#97a3af" text-anchor="middle">
    <text x="70" y="433">1</text><text x="131" y="433">2</text><text x="192" y="433">3</text><text x="253" y="433">4</text><text x="314" y="433">5</text>
    <text x="374" y="433">6</text><text x="435" y="433">7</text><text x="496" y="433">8</text><text x="557" y="433">9</text><text x="618" y="433">10</text>
    <text x="659" y="433">11</text>
  </g>
  <text x="662" y="462" fill="#6ee7a0" font-size="10.5" text-anchor="middle">28 B</text>

  <text x="40" y="478" fill="#97a3af" font-size="11.5">msg_id ехо у ACK · frag_off рахує байти в межах повідомлення · crc32 по всім 488 B, перевіряється лише на завершенні збірки</text>
</svg>
