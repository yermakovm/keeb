<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" font-family="system-ui, -apple-system, 'SF Pro Text', 'Segoe UI', 'PT Sans', 'Noto Sans', Arial, sans-serif">
  <!--
    Market position, plotted instead of described. X = what the buyer pays,
    Y = how repeatable and supported the offer is. The empty upper-middle is the
    claim of the business slide: an affordable, repeatable, configurable split
    with a keywell, sold in Ukraine.
  -->

  <!-- axes -->
  <line x1="90" y1="380" x2="750" y2="380" stroke="#4c5a66" stroke-width="1.5"/>
  <line x1="90" y1="60" x2="90" y2="380" stroke="#4c5a66" stroke-width="1.5"/>
  <text x="750" y="400" fill="#4c5a66" font-size="11.5" text-anchor="end">ціна для покупця →</text>
  <text x="76" y="220" fill="#4c5a66" font-size="11.5" transform="rotate(-90 76 220)" text-anchor="middle">повторюваність і підтримка ↑</text>

  <!-- quadrant guides -->
  <g stroke="#2b343c" stroke-width="1.2" stroke-dasharray="5 6">
    <line x1="420" y1="60" x2="420" y2="380"/>
    <line x1="90" y1="220" x2="750" y2="220"/>
  </g>

  <!-- OLX hand-made -->
  <g>
    <circle cx="200" cy="330" r="7" fill="#f0b05e"/>
    <text x="218" y="326" fill="#e8ecf0" font-size="12">АМАТОРСЬКІ ЗБІРКИ НА OLX</text>
    <text x="218" y="344" fill="#97a3af" font-size="10.5">поодинокий хендмейд: якість, ціна й підтримка</text>
    <text x="218" y="360" fill="#4c5a66" font-size="10.5">залежать від автора — партію не повторити</text>
  </g>

  <!-- splitted.space -->
  <g>
    <circle cx="392" cy="252" r="7" fill="#97a3af"/>
    <text x="372" y="238" fill="#e8ecf0" font-size="12" text-anchor="end">splitted.space</text>
    <text x="372" y="256" fill="#97a3af" font-size="10.5" text-anchor="end">вибір світчів, кейкапів, енкодерів,</text>
    <text x="372" y="272" fill="#4c5a66" font-size="10.5" text-anchor="end">але плати без keywell — інша ніша</text>
    <text x="372" y="288" fill="#4c5a66" font-size="10.5" text-anchor="end">→ ПОСЕРЕДНІЙ КОНКУРЕНТ</text>
  </g>

  <!-- foreign makers -->
  <g>
    <circle cx="690" cy="240" r="7" fill="#97a3af"/>
    <text x="690" y="224" fill="#e8ecf0" font-size="12" text-anchor="end">ІНОЗЕМНІ ВИРОБНИКИ</text>
    <text x="690" y="260" fill="#97a3af" font-size="10.5" text-anchor="end">індивідуальна збірка, логистика,</text>
    <text x="690" y="276" fill="#4c5a66" font-size="10.5" text-anchor="end">митниця, очікування — рахунок</text>
    <text x="690" y="292" fill="#4c5a66" font-size="10.5" text-anchor="end">за пристрій суттєво зростає</text>
  </g>

  <!-- the empty niche -->
  <g>
    <rect x="380" y="76" width="330" height="118" rx="14" fill="#12251c" stroke="#6ee7a0" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.9"/>
    <circle cx="470" cy="140" r="9" fill="#6ee7a0"/>
    <text x="490" y="112" fill="#6ee7a0" font-size="12">ВІЛЬНА НІША</text>
    <text x="490" y="132" fill="#e8ecf0" font-size="11.5">доступний, повторюваний,</text>
    <text x="490" y="148" fill="#e8ecf0" font-size="11.5">налаштовуваний спліт в Україні</text>
    <text x="490" y="172" fill="#97a3af" font-size="10.5">keywell-ергономіка + жива розкладка</text>
    <text x="490" y="188" fill="#4c5a66" font-size="10.5">з веб-конфігуратором замість пайки</text>
  </g>

  <!-- takeaway -->
  <text x="90" y="422" fill="#97a3af" font-size="12">Попит на хендмейд є — стабільної пропозиції немає. Між «кожен раз інакше» і «дорого й далеко»</text>
  <text x="90" y="442" fill="#6ee7a0" font-size="12">ніша доступного повторюваного спліту залишається порожньою.</text>
</svg>
