<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="system-ui, -apple-system, 'SF Pro Text', 'Segoe UI', 'PT Sans', 'Noto Sans', Arial, sans-serif">
<!-- Placeholder for a real screenshot of the web configurator (docs/assets/webui.png).
     Keep ~16:10 so it fits the left column, like assets/hw-demo-placeholder.svg.
     Replace the <img src> in docs/6_3_webui.md with assets/webui.png when the shot exists. -->
<rect width="640" height="400" fill="#0b0e11"/>
<rect x="14" y="14" width="612" height="372" rx="14" fill="none" stroke="#2b343c" stroke-width="3" stroke-dasharray="16 11"/>

<!-- browser chrome -->
<g fill="#394853"><circle cx="38" cy="34" r="4"/><circle cx="54" cy="34" r="4"/><circle cx="70" cy="34" r="4"/></g>
<rect x="110" y="24" width="300" height="20" rx="4" fill="none" stroke="#2b343c" stroke-width="2"/>
<text x="124" y="39" fill="#4c5a66" font-size="12">localhost:5173</text>
<line x1="14" y1="56" x2="626" y2="56" stroke="#2b343c" stroke-width="2"/>

<!-- board outline: two halves + the two screen strips -->
<g stroke="#4c5a66" stroke-width="2" fill="none">
  <rect x="40" y="86" width="250" height="150" rx="6"/>
  <rect x="350" y="86" width="250" height="150" rx="6"/>
</g>
<g fill="none" stroke="#394853" stroke-width="1.5">
  <rect x="52" y="98" width="226" height="126" fill="none"/>
  <rect x="362" y="98" width="226" height="126" fill="none"/>
</g>
<g fill="#6ee7a0" opacity="0.55">
  <rect x="278" y="112" width="28" height="60" rx="3"/>
  <rect x="334" y="112" width="28" height="60" rx="3"/>
</g>
<g fill="#97a3af" font-size="11">
  <text x="292" y="186" text-anchor="middle">screen 1</text>
  <text x="348" y="186" text-anchor="middle">screen 2</text>
</g>
<g fill="#4c5a66" font-size="12">
  <text x="165" y="252" text-anchor="middle">ліва половинка</text>
  <text x="475" y="252" text-anchor="middle">права половинка</text>
</g>

<!-- bottom slot: palette / widget table / event log -->
<rect x="40" y="278" width="560" height="70" rx="6" fill="none" stroke="#394853" stroke-width="2"/>
<g fill="#394853">
  <rect x="56" y="292" width="42" height="20" rx="3"/>
  <rect x="104" y="292" width="42" height="20" rx="3"/>
  <rect x="152" y="292" width="42" height="20" rx="3"/>
  <rect x="200" y="292" width="42" height="20" rx="3"/>
</g>
<text x="320" y="336" fill="#4c5a66" font-size="12" text-anchor="middle">палітра клавіш · таблиця віджетів · журнал подій</text>

<g fill="#97a3af" font-size="19" text-anchor="middle">
  <text x="320" y="370">Скріншот конфігуратора: розкладка, шари, екрани</text>
</g>
</svg>
