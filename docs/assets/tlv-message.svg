<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="system-ui, -apple-system, 'SF Pro Text', 'Segoe UI', 'PT Sans', 'Noto Sans', Arial, sans-serif">
  <!--
    KEEB TLV records: what a message is made of, and the whole vocabulary.

    Ids and sizes are the ones in keeb-module/proto/keeb_tlv_records.h
    (KEEB_TLV_TYPE(ns, op) = (ns << 12) | op, plus the _Static_assert list at the
    bottom of that file). app/scripts/gen-contract.mjs regenerates the app's copy
    from the same header, so a struct change breaks both builds.
  -->

  <!-- ① a message is a flat list of TLV records -->
  <text x="40" y="36" fill="#6ee7a0" font-size="12" letter-spacing="1">① ПОВІДОМЛЕННЯ = ПЛАСКИЙ СПИСОК ЗАПИСІВ, ≤ 1024 B</text>
  <g stroke="#2b343c" stroke-width="1.5">
    <rect x="40" y="46" width="70" height="40" fill="#12251c" stroke="#6ee7a0" stroke-opacity="0.55"/>
    <rect x="110" y="46" width="70" height="40" fill="#12251c" stroke="#6ee7a0" stroke-opacity="0.55"/>
    <rect x="180" y="46" width="170" height="40" fill="#141a20"/>
    <rect x="360" y="46" width="70" height="40" fill="#12251c" stroke="#6ee7a0" stroke-opacity="0.55"/>
    <rect x="430" y="46" width="70" height="40" fill="#12251c" stroke="#6ee7a0" stroke-opacity="0.55"/>
    <rect x="500" y="46" width="130" height="40" fill="#141a20"/>
    <rect x="640" y="46" width="40" height="40" fill="#10151a" stroke-dasharray="5 4"/>
  </g>
  <g font-size="11" fill="#e8ecf0" text-anchor="middle">
    <text x="75" y="63">type</text><text x="145" y="63">len</text><text x="265" y="63">value</text>
    <text x="395" y="63">type</text><text x="465" y="63">len</text><text x="565" y="63">value</text>
  </g>
  <g font-size="10" fill="#4c5a66" text-anchor="middle">
    <text x="75" y="78">2 B</text><text x="145" y="78">2 B</text><text x="265" y="78">len B</text>
    <text x="395" y="78">2 B</text><text x="465" y="78">2 B</text><text x="565" y="78">len B</text>
    <text x="660" y="70">…</text>
  </g>

  <!-- ② type = namespace | op -->
  <text x="40" y="110" fill="#6ee7a0" font-size="12" letter-spacing="1">② TYPE — 16 БІТІВ: NAMESPACE І OP</text>
  <g stroke="#2b343c" stroke-width="1.5" fill="#10151a">
    <rect x="40" y="128" width="30" height="28" fill="#12251c" stroke="#6ee7a0" stroke-opacity="0.55"/>
    <rect x="70" y="128" width="30" height="28" fill="#12251c" stroke="#6ee7a0" stroke-opacity="0.55"/>
    <rect x="100" y="128" width="30" height="28" fill="#12251c" stroke="#6ee7a0" stroke-opacity="0.55"/>
    <rect x="130" y="128" width="30" height="28" fill="#12251c" stroke="#6ee7a0" stroke-opacity="0.55"/>
    <rect x="160" y="128" width="30" height="28"/>
    <rect x="190" y="128" width="30" height="28"/>
    <rect x="220" y="128" width="30" height="28"/>
    <rect x="250" y="128" width="30" height="28"/>
    <rect x="280" y="128" width="30" height="28"/>
    <rect x="310" y="128" width="30" height="28"/>
    <rect x="340" y="128" width="30" height="28"/>
    <rect x="370" y="128" width="30" height="28"/>
    <rect x="400" y="128" width="30" height="28"/>
    <rect x="430" y="128" width="30" height="28"/>
    <rect x="460" y="128" width="30" height="28"/>
    <rect x="490" y="128" width="30" height="28"/>
  </g>
  <g font-size="9.5" fill="#4c5a66" text-anchor="middle">
    <text x="55" y="124">15</text><text x="85" y="124">14</text><text x="115" y="124">13</text><text x="145" y="124">12</text>
    <text x="175" y="124">11</text><text x="205" y="124">10</text><text x="235" y="124">9</text><text x="265" y="124">8</text>
    <text x="295" y="124">7</text><text x="325" y="124">6</text><text x="355" y="124">5</text><text x="385" y="124">4</text>
    <text x="415" y="124">3</text><text x="445" y="124">2</text><text x="475" y="124">1</text><text x="505" y="124">0</text>
  </g>
  <text x="95" y="172" fill="#6ee7a0" font-size="11" text-anchor="middle">NAMESPACE · 4 БІТИ</text>
  <text x="340" y="172" fill="#97a3af" font-size="11" text-anchor="middle">op · 12 бітів — всередині namespace не перетинаються</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#e8ecf0">
    <text x="540" y="140">0x1003 → KEYMAP · CELLS_SET</text>
    <text x="540" y="158">0x2004 → DISPLAY · DISPLAY_SET</text>
    <text x="540" y="176">0x0003 → SYS · ACK</text>
  </g>

  <!-- ③ the vocabulary, straight out of keeb_tlv_records.h -->
  <text x="40" y="206" fill="#6ee7a0" font-size="12" letter-spacing="1">③ СЛОВНИК: NAMESPACE → ОПЕРАЦІЇ — ТЕ, ЩО ВМІЄ КАНАЛ</text>

  <g>
    <rect x="40" y="216" width="230" height="196" rx="10" fill="#141a20" stroke="#2b343c" stroke-width="1.5"/>
    <text x="60" y="240" fill="#6ee7a0" font-size="12" letter-spacing="1">SYS · 0x0</text>
    <text x="60" y="258" fill="#4c5a66" font-size="10.5">сесія, можливості, відповідь, подія</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#97a3af">
      <text x="60" y="282">0x0001 PING</text>
      <text x="60" y="300">0x0002 INFO</text>
      <text x="60" y="318">0x0003 ACK</text>
      <text x="60" y="336">0x0004 NOTIFY</text>
      <text x="60" y="354">0x0005 TOKENS</text>
      <text x="60" y="372">0x0006 TOKEN_PARAMS</text>
    </g>
    <text x="60" y="398" fill="#4c5a66" font-size="10.5">невідомий type → UNKNOWN_TYPE</text>
  </g>

  <g>
    <rect x="285" y="216" width="230" height="196" rx="10" fill="#141a20" stroke="#2b343c" stroke-width="1.5"/>
    <text x="305" y="240" fill="#6ee7a0" font-size="12" letter-spacing="1">KEYMAP · 0x1</text>
    <text x="305" y="258" fill="#4c5a66" font-size="10.5">жива розкладка</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#97a3af">
      <text x="305" y="282">0x1001 CELLS_GET</text>
      <text x="305" y="300">0x1002 CELLS</text>
      <text x="305" y="318">0x1003 CELLS_SET</text>
      <text x="305" y="336">0x1004 SAVE · 0x1005 DISCARD</text>
      <text x="305" y="354">0x1007/08 LAYERS</text>
      <text x="305" y="372">0x100a–0d LAYER ops</text>
      <text x="305" y="390">0x1010 TEST_SET</text>
    </g>
    <text x="305" y="404" fill="#4c5a66" font-size="10.5">0x100e/0f — резерв під staged</text>
  </g>

  <g>
    <rect x="530" y="216" width="230" height="196" rx="10" fill="#141a20" stroke="#2b343c" stroke-width="1.5"/>
    <text x="550" y="240" fill="#6ee7a0" font-size="12" letter-spacing="1">DISPLAY · 0x2</text>
    <text x="550" y="258" fill="#4c5a66" font-size="10.5">таблиця віджетів екрана</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#97a3af">
      <text x="550" y="282">0x2001 DISPLAY_INFO</text>
      <text x="550" y="300">0x2002 DISPLAY_GET</text>
      <text x="550" y="318">0x2003/04 DISPLAY(_SET)</text>
      <text x="550" y="336">0x2005 WIDGET_SET</text>
      <text x="550" y="354">0x2006/07 TEXT · VALUE_SET</text>
      <text x="550" y="372">0x2008/0d PRESET(_NAME)</text>
      <text x="550" y="390">0x2009–0c SAVE · DISCARD</text>
    </g>
    <text x="550" y="404" fill="#4c5a66" font-size="10.5">SETTINGS 0x3 · IMAGE 0x4 — резерв</text>
  </g>

  <!-- ④ record payload sizes -->
  <text x="40" y="440" fill="#6ee7a0" font-size="12" letter-spacing="1">④ РОЗМІРИ PAYLOAD — ASSERTED У ЗАГОЛОВКАХ</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#97a3af">
    <text x="40" y="462">keeb_info 20 B · keeb_ack 10 B · keeb_notify 4 B · keeb_cell 16 B · keeb_cells_hdr 4 B</text>
    <text x="40" y="480">keeb_widget 7 B · keeb_layers_hdr 14 B · keeb_token_rec 6 B · keeb_display_info 21 B</text>
  </g>
  <text x="760" y="462" fill="#4c5a66" font-size="11" text-anchor="end">_Static_assert на кожному</text>
  <text x="760" y="480" fill="#4c5a66" font-size="11" text-anchor="end">→ gen-contract.mjs у app/</text>
</svg>
