<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="system-ui, -apple-system, 'SF Pro Text', 'Segoe UI', 'PT Sans', 'Noto Sans', Arial, sans-serif">
  <!--
    One KEEB TLV exchange: what goes over GATT, in which order, and how an
    answer comes back.

    From keeb-module/proto/keeb_tlv.c (engine: one message in flight, ACK per
    processed message, all-or-nothing apply) and keeb-module/transport/keeb_ble.c
    (cmd = write without response, evt = notify, subscription to evt is what
    makes a link a configurator link).
  -->

  <defs>
    <marker id="toKb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6ee7a0"/>
    </marker>
    <marker id="toHost" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#cdd5de"/>
    </marker>
  </defs>

  <!-- lanes -->
  <g>
    <rect x="60" y="18" width="180" height="38" rx="9" fill="#141a20" stroke="#2b343c" stroke-width="1.5"/>
    <text x="150" y="36" fill="#e8ecf0" font-size="13" text-anchor="middle">КОНФІГУРАТОР</text>
    <text x="150" y="50" fill="#4c5a66" font-size="10.5" text-anchor="middle">Web Bluetooth</text>
    <rect x="560" y="18" width="180" height="38" rx="9" fill="#12251c" stroke="#6ee7a0" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="650" y="36" fill="#e8ecf0" font-size="13" text-anchor="middle">КЛАВІАТУРА · central</text>
    <text x="650" y="50" fill="#4c5a66" font-size="10.5" text-anchor="middle">keeb_tlv + GATT</text>
  </g>
  <g stroke="#2b343c" stroke-width="1.5" stroke-dasharray="4 5">
    <line x1="150" y1="56" x2="150" y2="472"/>
    <line x1="650" y1="56" x2="650" y2="472"/>
  </g>

  <!-- 1 · handshake -->
  <text x="40" y="76" fill="#6ee7a0" font-size="11" letter-spacing="1">1 · ПІДПИСКА І HANDSHAKE</text>
  <line x1="150" y1="94" x2="642" y2="94" stroke="#6ee7a0" stroke-width="2" marker-end="url(#toKb)"/>
  <text x="160" y="88" fill="#e8ecf0" font-size="11.5">subscribe на evt (CCC) — після цього лінк стає «конфігураторським»</text>
  <text x="160" y="110" fill="#4c5a66" font-size="10.5">cmd = write без відповіді · security піднімає сам Zephyr</text>

  <line x1="650" y1="130" x2="158" y2="130" stroke="#cdd5de" stroke-width="1.6" opacity="0.75" marker-end="url(#toHost)"/>
  <text x="160" y="124" fill="#e8ecf0" font-size="11.5">INFO 0x0002 → TOKENS 0x0005 → PRESET_NAME ×N</text>
  <text x="160" y="146" fill="#4c5a66" font-size="10.5">info 20 B · token_hash каже, чи таблиця бехавіорів та сама</text>

  <!-- 2 · read -->
  <text x="40" y="176" fill="#6ee7a0" font-size="11" letter-spacing="1">2 · ЧИТАННЯ РОЗКЛАДКИ</text>
  <line x1="150" y1="194" x2="642" y2="194" stroke="#6ee7a0" stroke-width="2" marker-end="url(#toKb)"/>
  <text x="160" y="188" fill="#e8ecf0" font-size="11.5">CELLS_GET 0x1001 · 1 пакет (4 B payload)</text>

  <line x1="650" y1="226" x2="158" y2="226" stroke="#cdd5de" stroke-width="1.6" opacity="0.75" marker-end="url(#toHost)"/>
  <text x="160" y="220" fill="#e8ecf0" font-size="11.5">CELLS 0x1002 — 488 B → 11 notify по 62 B</text>
  <text x="160" y="242" fill="#4c5a66" font-size="10.5">cells_hdr 4 B + 30 × 16 B · crc32 на останньому фрагменті</text>

  <line x1="650" y1="262" x2="158" y2="262" stroke="#cdd5de" stroke-width="2" marker-end="url(#toHost)"/>
  <text x="160" y="256" fill="#6ee7a0" font-size="11.5">ACK 0x0003 — 14 B (FLAGS: REPLY) · msg_id — ТОЙ САМИЙ, ЩО У ЗАПИТУ</text>

  <!-- 3 · write -->
  <text x="40" y="296" fill="#6ee7a0" font-size="11" letter-spacing="1">3 · ЗАПИС: РЕДАГУВАННЯ → КОМІТ</text>
  <line x1="150" y1="314" x2="642" y2="314" stroke="#6ee7a0" stroke-width="2" marker-end="url(#toKb)"/>
  <text x="160" y="308" fill="#e8ecf0" font-size="11.5">CELLS_SET 0x1003 — 488 B → 11 пакетів (FIRST лише на першому)</text>
  <rect x="430" y="326" width="212" height="42" rx="8" fill="#12251c" stroke="#6ee7a0" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="536" y="343" fill="#6ee7a0" font-size="10.5" text-anchor="middle">усі комірки валідуються до запису</text>
  <text x="536" y="358" fill="#97a3af" font-size="10.5" text-anchor="middle">all-or-nothing: або всі, або нічого</text>

  <line x1="650" y1="382" x2="158" y2="382" stroke="#cdd5de" stroke-width="2" marker-end="url(#toHost)"/>
  <text x="160" y="376" fill="#6ee7a0" font-size="11.5">ACK — STATUS · err_code · detail · extra (10 B PAYLOAD)</text>
  <text x="160" y="398" fill="#4c5a66" font-size="10.5">err_code 0…16: BAD_CRC · BAD_SEQ · UNKNOWN_TOKEN · BUSY</text>

  <line x1="650" y1="414" x2="158" y2="414" stroke="#cdd5de" stroke-width="1.6" opacity="0.75" marker-end="url(#toHost)"/>
  <text x="160" y="408" fill="#e8ecf0" font-size="11.5">NOTIFY 0x0004 — EV_CELLS_SET 4+3 B, EV_LAYER_STATE 4+4 B</text>

  <!-- 4 · persistence -->
  <text x="40" y="444" fill="#6ee7a0" font-size="11" letter-spacing="1">4 · ЗБЕРЕЖЕННЯ / ВІДКАТ</text>
  <line x1="150" y1="460" x2="642" y2="460" stroke="#6ee7a0" stroke-width="2" marker-end="url(#toKb)"/>
  <text x="160" y="454" fill="#e8ecf0" font-size="11.5">SAVE 0x1004 · DISCARD 0x1005 · RESET 0x1006</text>
  <text x="470" y="454" fill="#6ee7a0" font-size="11.5">→ ACK + EV_SAVED</text>

  <text x="40" y="490" fill="#4c5a66" font-size="11">одне повідомлення в полі: другий запит → KEEB_ERR_BUSY у ACK</text>
</svg>
