<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" width="480" height="600" font-family="system-ui, -apple-system, 'SF Pro Text', 'Segoe UI', 'PT Sans', 'Noto Sans', Arial, sans-serif">
  <!--
    Placeholder for the keyboard photo. Aspect ratio 480:600 = the right half
    of a 16:9 slide (576x720), so `contain` fills that region exactly.
    Replace with a real photo: docs/assets/keyboard.png
  -->
  <defs>
    <pattern id="keys" width="30" height="26" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="24" height="20" rx="4" fill="none" stroke="#394853" stroke-width="3"/>
    </pattern>
  </defs>

  <rect width="480" height="600" fill="#0b0e11"/>

  <rect x="20" y="20" width="440" height="560" rx="16"
        fill="none" stroke="#2b343c" stroke-width="4" stroke-dasharray="18 12"/>

  <!-- halves -->
  <g stroke="#4c5a66" stroke-width="4" fill="none">
    <rect x="60" y="150" width="160" height="120" rx="12"/>
    <rect x="260" y="150" width="160" height="120" rx="12"/>
  </g>
  <rect x="72" y="164" width="136" height="92" fill="url(#keys)"/>
  <rect x="272" y="164" width="136" height="92" fill="url(#keys)"/>

  <!-- status LEDs -->
  <g fill="#6ee7a0" opacity="0.6">
    <rect x="60" y="285" width="34" height="7" rx="3.5"/>
    <rect x="260" y="285" width="34" height="7" rx="3.5"/>
  </g>

  <!-- radio link between the halves -->
  <g stroke="#6ee7a0" stroke-width="3" fill="none" opacity="0.5" stroke-linecap="round">
    <path d="M240 262 v-14"/>
    <path d="M226 240 a20 20 0 0 1 28 0"/>
    <path d="M214 226 a34 34 0 0 1 52 0"/>
  </g>

  <text x="240" y="380" fill="#97a3af" font-size="34" text-anchor="middle">Фотографія клавіатури</text>
  <text x="240" y="430" fill="#4c5a66" font-size="22" text-anchor="middle">docs/assets/keyboard.png</text>
</svg>
